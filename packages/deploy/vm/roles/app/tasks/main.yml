---
# =============================================================================
# Blue/Green Deployment Tasks
# =============================================================================

# Phase 1: Determine deployment color
# =============================================================================

- name: Read current active color from file
  slurp:
    src: '{{ app_dir }}/active_color'
  register: current_color_file
  ignore_errors: yes

- name: Set current active color (from file)
  set_fact:
    current_active_color: '{{ (current_color_file.content | b64decode).strip() }}'
  when: current_color_file is succeeded

- name: Set current active color (default to blue)
  set_fact:
    current_active_color: 'blue'
  when: current_color_file is failed

- name: Determine target deployment color
  set_fact:
    target_color: "{{ 'green' if current_active_color == 'blue' else 'blue' }}"

- name: Display deployment information
  debug:
    msg:
      - 'Current active color: {{ current_active_color }}'
      - 'Target deployment color: {{ target_color }}'
      - 'Deploying to: {{ app_dir }}/{{ target_color }}'

# Phase 2: Setup user and directories
# =============================================================================

- name: Create application group
  group:
    name: '{{ app_group }}'
    system: yes
    state: present

- name: Create application user
  user:
    name: '{{ app_user }}'
    group: '{{ app_group }}'
    system: yes
    shell: /bin/bash
    home: '{{ app_dir }}'
    create_home: no
    state: present

- name: Create application directories
  file:
    path: '{{ item }}'
    state: directory
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0755'
  loop:
    - '{{ app_dir }}'
    - '{{ app_dir }}/releases'
    - '{{ app_dir }}/shared'
    - '{{ app_dir }}/shared/node_modules'
    - '{{ app_dir }}/shared/uploads'
    - '{{ log_dir }}'
    - '{{ backup_dir }}'

# Phase 3: Clone and build new version
# =============================================================================

# Git safe.directory: Required because root runs git but directory may be owned by app_user
# from previous deployments. Git 2.35.2+ blocks this for security unless explicitly allowed.
- name: Mark target directory as git safe.directory
  command: git config --global --add safe.directory {{ app_dir }}/{{ target_color }}
  changed_when: false

# Use GIT_ASKPASS to securely provide credentials without exposing token in URLs or process list
- name: Create temporary git credential script
  copy:
    content: |
      #!/bin/bash
      echo "{{ github_token }}"
    dest: /tmp/git-askpass.sh
    mode: '0700'
  when: git_use_token | default(false)
  no_log: true

- name: Clone or update repository (with token)
  git:
    repo: '{{ git_repo }}'
    dest: '{{ app_dir }}/{{ target_color }}'
    version: '{{ git_branch }}'
    force: yes
    accept_hostkey: yes
  environment:
    GIT_ASKPASS: /tmp/git-askpass.sh
    GIT_USERNAME: x-access-token
  register: git_result
  when: git_use_token | default(false)

- name: Clone or update repository (public)
  git:
    repo: '{{ git_repo }}'
    dest: '{{ app_dir }}/{{ target_color }}'
    version: '{{ git_branch }}'
    force: yes
    accept_hostkey: yes
  register: git_result
  when: not (git_use_token | default(false))

- name: Remove temporary git credential script
  file:
    path: /tmp/git-askpass.sh
    state: absent
  when: git_use_token | default(false)

- name: Set ownership of cloned repository
  file:
    path: '{{ app_dir }}/{{ target_color }}'
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    recurse: yes

- name: Create environment file for target color
  template:
    src: env.j2
    dest: '{{ app_dir }}/{{ target_color }}/.env'
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0600'

- name: Install pnpm globally
  npm:
    name: pnpm
    global: yes
    state: present

- name: Install dependencies
  shell: |
    cd {{ app_dir }}/{{ target_color }}
    pnpm install
  args:
    chdir: '{{ app_dir }}/{{ target_color }}'
  environment:
    PATH: '/usr/local/bin:/usr/bin:/bin'

- name: Build shared package
  shell: |
    cd {{ app_dir }}/{{ target_color }}
    pnpm --filter shared build
  args:
    chdir: '{{ app_dir }}/{{ target_color }}'
  environment:
    PATH: '/usr/local/bin:/usr/bin:/bin'

- name: Build backend
  shell: |
    cd {{ app_dir }}/{{ target_color }}
    pnpm --filter backend build
  args:
    chdir: '{{ app_dir }}/{{ target_color }}'
  environment:
    PATH: '/usr/local/bin:/usr/bin:/bin'

- name: Build frontend
  shell: |
    cd {{ app_dir }}/{{ target_color }}
    pnpm --filter frontend build
  args:
    chdir: '{{ app_dir }}/{{ target_color }}'
  environment:
    PATH: '/usr/local/bin:/usr/bin:/bin'
    NODE_ENV: production
    VITE_BACKEND_URL: "{{ app_env_vars.VITE_BACKEND_URL | default('https://' ~ domain_name) }}"

- name: Create frontend static directory for target color
  file:
    path: '{{ app_dir }}/{{ target_color }}/frontend'
    state: directory
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0755'

- name: Copy built frontend to deployment directory
  synchronize:
    src: '{{ app_dir }}/{{ target_color }}/packages/frontend/dist/'
    dest: '{{ app_dir }}/{{ target_color }}/frontend/'
  delegate_to: '{{ inventory_hostname }}'

- name: Set ownership of frontend directory
  file:
    path: '{{ app_dir }}/{{ target_color }}/frontend'
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    recurse: yes

# Phase 4: Database migrations
# =============================================================================

- name: Run database migrations
  shell: |
    set -a
    source {{ app_dir }}/{{ target_color }}/.env
    set +a
    cd {{ app_dir }}/{{ target_color }}/packages/backend
    npx prisma migrate deploy
  args:
    chdir: '{{ app_dir }}/{{ target_color }}/packages/backend'
    executable: /bin/bash

- name: Setup Row Level Security
  shell: |
    set -a
    source {{ app_dir }}/{{ target_color }}/.env
    set +a
    npx tsx src/prisma/setupRowLevelSecurityCli.ts
  args:
    chdir: '{{ app_dir }}/{{ target_color }}/packages/backend'
    executable: /bin/bash

# Phase 5: Deploy systemd services for target color
# =============================================================================

- name: Deploy backend systemd service for target color
  template:
    src: backend-{{ target_color }}.service.j2
    dest: /etc/systemd/system/backend-{{ target_color }}.service
    mode: '0644'
  notify: reload systemd

- name: Deploy worker systemd service for target color
  template:
    src: worker-{{ target_color }}.service.j2
    dest: /etc/systemd/system/worker-{{ target_color }}.service
    mode: '0644'
  when: worker_enabled
  notify: reload systemd

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

# Phase 6: Start target color services
# =============================================================================

- name: Start backend service ({{ target_color }})
  systemd:
    name: backend-{{ target_color }}
    state: restarted
    enabled: yes

- name: Start worker service ({{ target_color }})
  systemd:
    name: worker-{{ target_color }}
    state: restarted
    enabled: yes
  when: worker_enabled

# Phase 7: Health checks
# =============================================================================

- name: Wait for backend to be ready
  uri:
    url: 'http://localhost:{{ blue_backend_port if target_color == "blue" else green_backend_port }}/api/health'
    method: GET
    status_code: 200
  register: health_check
  retries: '{{ health_check_retries }}'
  delay: '{{ health_check_delay }}'
  until: health_check.status == 200

- name: Verify frontend static files exist
  stat:
    path: '{{ app_dir }}/{{ target_color }}/frontend/index.html'
  register: frontend_check
  failed_when: not frontend_check.stat.exists

# Phase 8: Switch traffic (update active color)
# =============================================================================

- name: Save new active color to file
  copy:
    content: '{{ target_color }}'
    dest: '{{ app_dir }}/active_color'
    mode: '0644'

- name: Update Caddy configuration with new active color
  template:
    src: ../caddy/templates/Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
  vars:
    active_color: '{{ target_color }}'

- name: Reload Caddy (zero downtime)
  systemd:
    name: caddy
    state: reloaded

- name: Display traffic switch message
  debug:
    msg: 'Traffic switched to {{ target_color }} deployment'

# Phase 9: Connection draining
# =============================================================================

- name: Wait for connection draining
  pause:
    seconds: '{{ connection_drain_time }}'
    prompt: 'Waiting {{ connection_drain_time }} seconds for connection draining...'

# Phase 10: Stop old services
# =============================================================================

- name: Stop old backend service ({{ current_active_color }})
  systemd:
    name: backend-{{ current_active_color }}
    state: stopped
  ignore_errors: yes

- name: Stop old worker service ({{ current_active_color }})
  systemd:
    name: worker-{{ current_active_color }}
    state: stopped
  when: worker_enabled
  ignore_errors: yes

# Phase 11: Cleanup
# =============================================================================

- name: Clean up old releases
  shell: |
    cd {{ app_dir }}/releases && \
    ls -t | tail -n +6 | xargs -r rm -rf
  ignore_errors: yes

- name: Display deployment success message
  debug:
    msg:
      - '==================================================='
      - 'Deployment completed successfully!'
      - 'Active deployment: {{ target_color }}'
      - 'Previous deployment: {{ current_active_color }} (stopped)'
      - '==================================================='
