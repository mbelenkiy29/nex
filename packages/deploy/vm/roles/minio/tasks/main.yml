---
# Install and configure MinIO
# MinIO is an S3-compatible object storage server

- name: Create MinIO group
  group:
    name: minio
    system: yes
    state: present

- name: Create MinIO user
  user:
    name: minio
    group: minio
    system: yes
    shell: /usr/sbin/nologin
    home: '{{ minio_data_dir }}'
    create_home: no
    state: present

- name: Create MinIO directories
  file:
    path: '{{ item }}'
    state: directory
    owner: minio
    group: minio
    mode: '0750'
  loop:
    - '{{ minio_data_dir }}'
    - '{{ minio_config_dir }}'
    - /usr/local/bin

- name: Check if MinIO is already installed
  stat:
    path: /usr/local/bin/minio
  register: minio_binary

- name: Get installed MinIO version
  command: /usr/local/bin/minio --version
  register: installed_version
  changed_when: false
  failed_when: false
  when: minio_binary.stat.exists

- name: Download MinIO binary
  get_url:
    url: 'https://dl.min.io/server/minio/release/linux-amd64/minio'
    dest: /usr/local/bin/minio
    mode: '0755'
    owner: root
    group: root
  when: not minio_binary.stat.exists or (installed_version.stdout is defined and minio_version not in installed_version.stdout)
  notify: restart minio

- name: Download MinIO Client (mc)
  get_url:
    url: 'https://dl.min.io/client/mc/release/linux-amd64/mc'
    dest: /usr/local/bin/mc
    mode: '0755'
    owner: root
    group: root

- name: Create MinIO environment file
  template:
    src: minio.env.j2
    dest: '{{ minio_config_dir }}/minio.env'
    owner: minio
    group: minio
    mode: '0600'
  notify: restart minio

- name: Create MinIO systemd service
  template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: '0644'
  notify:
    - reload systemd
    - restart minio

- name: Start and enable MinIO
  systemd:
    name: minio
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for MinIO to be ready
  wait_for:
    port: '{{ minio_port }}'
    delay: 2
    timeout: 30

- name: Configure MinIO alias
  command: >
    mc alias set local
    http://localhost:{{ minio_port }}
    {{ minio_root_user }}
    {{ minio_root_password }}
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  changed_when: false

- name: Create MinIO public bucket
  command: >
    mc mb local/{{ minio_bucket_public }} --ignore-existing
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  register: public_bucket_created
  changed_when: '"Bucket created successfully" in public_bucket_created.stdout'

- name: Create MinIO private bucket
  command: >
    mc mb local/{{ minio_bucket_private }} --ignore-existing
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  register: private_bucket_created
  changed_when: '"Bucket created successfully" in private_bucket_created.stdout'

- name: Set public bucket anonymous download policy
  command: >
    mc anonymous set download local/{{ minio_bucket_public }}
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  changed_when: false

- name: Create MinIO application user
  command: >
    mc admin user add local
    {{ minio_app_user }}
    {{ minio_app_password }}
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  register: user_created
  failed_when: false
  changed_when: '"Added user" in user_created.stdout'

- name: Attach readwrite policy to application user
  command: >
    mc admin policy attach local
    readwrite
    --user {{ minio_app_user }}
  become: yes
  become_user: minio
  environment:
    HOME: '{{ minio_data_dir }}'
  changed_when: false
